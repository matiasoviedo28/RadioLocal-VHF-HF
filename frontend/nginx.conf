# Configuración de nginx para el frontend de RadioLocal-VHF-HF.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Servir los estáticos de la SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend (activo desde Fase 1: el frontend consume /api/).
    # El host "backend" es el nombre del servicio en docker-compose.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Red de seguridad: preparar una zona (descarga de tiles) o un cómputo
        # pesado pueden tardar. Timeouts holgados para no devolver 504.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
        # Exponemos el header con los bounds del overlay al JS del navegador.
        add_header Access-Control-Expose-Headers "X-Bbox";
    }
}
